services:
  # Serveur Node.js du portfolio, construit à partir du Dockerfile
  app:
    build: .
    image: portfolio-app:dev
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "3000"   # port interne fixe : c'est celui qu'attend nginx/default.conf
    expose:
      - "3000"       # accessible uniquement depuis le réseau Compose, pas depuis l'hôte
    volumes:
      - ./public:/app/public:ro   # hot-reload en dev (supprimer en prod)
    restart: unless-stopped

  # Reverse proxy Nginx : seul service exposé sur la machine hôte
  proxy:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      start_interval: 2s
    restart: unless-stopped
