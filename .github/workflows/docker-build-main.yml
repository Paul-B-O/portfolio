name: Build & Push Docker image (main)

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  # GHCR impose un nom en minuscules (le propriétaire du dépôt est Paul-B-O)
  IMAGE: ghcr.io/paul-b-o/portfolio

jobs:
  # L'image n'est publiée que si les tests passent
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Ignoré par `act` en local (ACT=true) : on teste le build sans rien publier
      - name: Log in to GHCR
        if: ${{ !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ !env.ACT }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
          # Relie le paquet GHCR au dépôt (visible dans l'onglet Packages du repo)
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
